# Azure Functions Deployment Workflow
# 修复说明：确保从 api/ 目录构建并部署，host.json 在包根目录

name: Build and deploy Node.js project to Azure Function App - researchapp-functions

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/main_researchapp-functions.yml'
  workflow_dispatch:

env:
  # 重要：指向 Azure Functions 项目目录
  AZURE_FUNCTIONAPP_PATH: 'api'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.AZURE_FUNCTIONAPP_PATH }}/package-lock.json'

      # 在 api 目录中安装依赖和构建
      - name: 'Install dependencies'
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PATH }}
        run: npm ci

      - name: 'Build TypeScript'
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PATH }}
        run: npm run build

      # 预部署验证：确保关键文件存在
      - name: 'Validate deployment package'
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PATH }}
        run: |
          echo "=== 验证 Azure Functions 部署包 ==="
          
          # 检查 host.json
          if [ ! -f "host.json" ]; then
            echo "❌ 错误: host.json 不存在于 api/ 目录"
            exit 1
          fi
          echo "✅ host.json 存在"
          
          # 检查 package.json
          if [ ! -f "package.json" ]; then
            echo "❌ 错误: package.json 不存在"
            exit 1
          fi
          echo "✅ package.json 存在"
          
          # 检查编译后的函数
          if [ ! -d "dist/functions" ]; then
            echo "❌ 错误: dist/functions 目录不存在"
            exit 1
          fi
          echo "✅ dist/functions 目录存在"
          
          # 列出将要部署的函数
          echo "=== 已编译的函数 ==="
          ls -la dist/functions/
          
          # 确保 local.settings.json 不会被包含
          if [ -f "local.settings.json" ]; then
            echo "⚠️ 警告: local.settings.json 存在，将从部署包中排除"
          fi
          
          echo "=== 验证通过 ✅ ==="

      # 安装生产依赖并创建部署包
      - name: 'Prepare deployment package'
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PATH }}
        run: |
          # 创建临时部署目录
          mkdir -p ../deploy-package
          
          # 复制必要文件到部署目录
          cp host.json ../deploy-package/
          cp package.json ../deploy-package/
          cp package-lock.json ../deploy-package/
          cp -r dist ../deploy-package/
          
          # 在部署目录中安装生产依赖
          cd ../deploy-package
          npm ci --omit=dev
          
          # 创建 zip 包（确保 host.json 在根目录）
          zip -r ../release.zip .
          
          # 显示包内容（前 30 行）
          echo "=== 部署包内容 ==="
          unzip -l ../release.zip | head -30
          echo "..."
          echo "包大小: $(ls -lh ../release.zip | awk '{print $5}')"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: azure-functions-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: azure-functions-app

      - name: 'Verify package structure'
        run: |
          echo "=== 验证下载的包 ==="
          unzip -l release.zip | grep -E "(host.json|package.json|dist/)" | head -20
          
          # 解压并验证 host.json 在根目录
          unzip -q release.zip -d verify-temp
          if [ ! -f "verify-temp/host.json" ]; then
            echo "❌ 错误: host.json 不在包的根目录！"
            exit 1
          fi
          echo "✅ host.json 在包根目录"
          rm -rf verify-temp
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_59484759A34C4AD195EA7EDA7D43C482 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7E7C19E59D84C4DB522F0E8F71B3B17 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_67F44A2F73EB4A84B26CA9528164AE58 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'researchapp-functions'
          slot-name: 'Production'
          package: release.zip
          